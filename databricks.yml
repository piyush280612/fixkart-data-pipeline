bundle:
  name: fixkart_data_pipeline

# Centralized Variables (Injected via dbutils.widgets into your notebooks)
variables:
  catalog_name:
    description: "The target Unity Catalog name"
    default: "main"
  schema_name:
    description: "The target schema/database"
    default: "fixkart_prd"
  source_system:
    description: "Lineage identifier for the source system"
    default: "fixkart_core_backend"
  rbac_principal:
    description: "The user group receiving SELECT permissions"
    default: "account users"

targets:
  prod:
    workspace:
      # Replace with your actual Databricks workspace URL
      host: https://dbc-854ba7db-07ef.cloud.databricks.com
    resources:
      jobs:
        fixkart_etl_pipeline:
          name: "Fixkart End-to-End Pipeline"
          job_clusters:
            - job_cluster_key: default_cluster
              new_cluster:
                spark_version: "14.3.x-scala2.12"
                node_type_id: "Standard_DS3_v2" # Adjust for AWS/GCP if not on Azure
                num_workers: 2
          
          # Pass the bundle variables down to the notebook parameters
          parameters:
            - name: catalog_name
              default: ${var.catalog_name}
            - name: schema_name
              default: ${var.schema_name}
            - name: source_system
              default: ${var.source_system}
            - name: rbac_principal
              default: ${var.rbac_principal}

          tasks:
            - task_key: 00_generate_mock_data
              notebook_task:
                notebook_path: ../src/00_mock_data_generator.ipynb
              job_cluster_key: default_cluster
            
            - task_key: 01_ingest_bronze
              depends_on:
                - task_key: 00_generate_mock_data
              notebook_task:
                notebook_path: ../src/01_bronze_ingestion.ipynb
              job_cluster_key: default_cluster

            - task_key: 02_transform_silver
              depends_on:
                - task_key: 01_ingest_bronze
              notebook_task:
                notebook_path: ../src/02_silver_transform.ipynb
              job_cluster_key: default_cluster

            - task_key: 03_aggregate_gold
              depends_on:
                - task_key: 02_transform_silver
              notebook_task:
                notebook_path: ../src/03_gold_aggregation.ipynb
              job_cluster_key: default_cluster
              
            - task_key: 04_apply_governance
              depends_on:
                - task_key: 03_aggregate_gold
              notebook_task:
                notebook_path: ../src/04_apply_governance.ipynb
              job_cluster_key: default_cluster