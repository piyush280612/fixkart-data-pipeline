name: CI/CD Pipeline for Fixkart ETL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PyTest
        run: pytest tests/

  deploy:
    name: Deploy to Databricks
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    # Store these securely in your GitHub Repository Secrets
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
        
      - name: Deploy Databricks Asset Bundle
        run: databricks bundle deploy -t prod
          
      # Optional: Automatically trigger a pipeline run post-deployment
      - name: Trigger Pipeline Run
        run: databricks bundle run fixkart_etl_pipeline -t prod